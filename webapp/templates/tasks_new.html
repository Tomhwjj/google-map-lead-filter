{% extends "base.html" %}
{% block title %}新建任务{% endblock %}
{% block content %}
<h1>新建获客任务</h1>

<form method="post" class="form">
  <label>目标国家（2 字母代码，如 DE / FR / NL）</label>
  <input type="text" name="country" placeholder="DE" value="DE">

  <label>搜索关键词（每行一个）</label>
  <textarea name="keywords" rows="6" placeholder="inverter distributor Germany&#10;battery storage wholesaler Deutschland"></textarea>

  <label>数据源（逗号分隔）</label>
  <input type="text" name="sources" placeholder="gmaps, enf, search" value="gmaps, enf, search">

  <button type="submit">创建任务</button>
</form>
<p class="hint">创建后得到 task_id，随后在「入库」页粘贴评分 JSON 完成三段式比对入库。</p>
{% endblock %}
